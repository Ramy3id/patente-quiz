<script>
  // Tactical Web Audio API
  const soundEngine = {
    ctx: null,
    enabled: true,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    click() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      } catch(e) {}
    },
    correct() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.06, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.18);
        });
      } catch(e) {}
    },
    wrong() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      } catch(e) {}
    }
  };

  window.toggleAudio = function() {
    soundEngine.enabled = !soundEngine.enabled;
    document.getElementById('audio-icon').innerText = soundEngine.enabled ? '🔊' : '🔇';

window.toggleDrawer = function(id) {
    soundEngine.click();
    const drawer = document.getElementById(`drawer-${id}`);
    if (drawer) drawer.classList.toggle('open');
  };

  window.setFilter = function(f) {
    soundEngine.click();
    currentFilter = f;
    document.querySelectorAll('.f-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.f === f);
    });
    renderQuestions();
  };

  window.filterQuestions = function() {
    renderQuestions();
  };

  window.toggleStudyMode = function() {
    soundEngine.click();
    isStudyMode = document.getElementById('study-mode-toggle').checked;
    document.querySelectorAll('.study-badge-direct').forEach(b => {
      b.classList.toggle('show', isStudyMode);
    });
  };

  function updateScoreDisplay() {
    document.getElementById('stat-correct').innerText = userStats.correct;
    document.getElementById('stat-wrong').innerText = userStats.wrong;
    const remaining = Math.max(0, DATA.domande.length - (userStats.correct + userStats.wrong));
    document.getElementById('stat-remaining').innerText = remaining;
  }

  // Keyboard shortcut M for audio
  window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') toggleAudio();
  });

  // Initial render
  renderQuestions();
</script>
