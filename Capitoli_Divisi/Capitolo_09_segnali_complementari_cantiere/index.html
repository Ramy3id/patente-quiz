<script>
  // Tactical Web Audio API
  const soundEngine = {
    ctx: null,
    enabled: true,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    click() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      } catch(e) {}
    },
    correct() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.06, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.18);
        });
      } catch(e) {}
    },
    wrong() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      } catch(e) {}
    }
  };

  window.toggleAudio = function() {
    soundEngine.enabled = !soundEngine.enabled;
    document.getElementById('audio-icon').innerText = soundEngine.enabled ? '🔊' : '🔇';

  let userStats = { correct: 0, wrong: 0 };
  let currentFilter = 'all';
  let isStudyMode = false;

  function renderQuestions() {
    const container = document.getElementById('questions-list');
    container.innerHTML = '';
    const query = document.getElementById('q-search').value.toLowerCase().trim();

    DATA.domande.forEach((q, idx) => {
      // Filters
      if (currentFilter === 'true' && !q.risposta) return;
      if (currentFilter === 'false' && q.risposta) return;

      const qTextLower = q.domanda.toLowerCase();
      const subLower = (q.sotto_argomento || '').toLowerCase();
      const trLower = (q.traduzione || '').toLowerCase();

      if (query !== '' && !qTextLower.includes(query) && !subLower.includes(query) && !trLower.includes(query)) {
        return;
      }

      const card = document.createElement('div');
      card.className = 'q-card';
      card.id = `q-card-${q.id}`;

      let imgHtml = '';
      if (q.immagine && q.immagine.trim() !== '') {
        imgHtml = `
          <div class="q-img-wrap">
            <img src="${q.immagine}" alt="Segnale" onclick="window.open(this.src, '_blank')">
          </div>
        `;
      }

      card.innerHTML = `
        ${imgHtml}
        <div class="q-body">
          <div class="q-card-top">
            <span class="q-id-pill">#${q.id}</span>
            <span class="q-sub-badge">${q.sotto_argomento || ''}</span>
          </div>

          <div class="q-text-content">${q.domanda}</div>

          <div class="q-actions-row">
            <button class="btn-ans btn-ans-v" onclick="answerQuestion(${q.id}, true)">
              <span>VERO</span>
            </button>
            <button class="btn-ans btn-ans-f" onclick="answerQuestion(${q.id}, false)">
              <span>FALSO</span>
            </button>

            <span class="status-tag" id="status-${q.id}"></span>
            <span class="study-badge-direct ${isStudyMode ? 'show' : ''} ${q.risposta ? 'is-v' : 'is-f'}" id="study-badge-${q.id}">
              ${q.risposta ? 'VERO ✅' : 'FALSO ❌'}
            </span>

            <button class="btn-explain-toggle" onclick="toggleDrawer(${q.id})">
              <span>💡 الترجمة والشرح وكشف الفخ</span>
            </button>
          </div>

          <div class="explain-drawer" id="drawer-${q.id}">
            <div class="ex-item"><strong>📖 الترجمة السياقية:</strong> ${q.traduzione || 'سؤال وزاري مباشر.'}</div>
            <div class="ex-item"><strong>💡 الشرح والقاعدة المرورية:</strong> ${q.spiegazione || 'مطابق لنصوص كود السير.'}</div>
            ${q.trabocchetto ? `<div class="trap-banner">${q.trabocchetto}</div>` : ''}
            ${q.parole_chiave && q.parole_chiave.length > 0 ? `
              <div class="kw-strip">
                ${q.parole_chiave.map(k => `<span class="kw-pill">${k}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;

      container.appendChild(card);
    });

    updateScoreDisplay();
  }

  window.answerQuestion = function(id, userChoice) {
    const q = DATA.domande.find(item => item.id === id);
    if (!q) return;

    const card = document.getElementById(`q-card-${id}`);
    const tag = document.getElementById(`status-${id}`);
    const isCorrect = (userChoice === q.risposta);

    if (isCorrect) {
      soundEngine.correct();
      tag.className = 'status-tag ok';
      tag.innerText = '✅ إجابة صحيحة';
      card.className = 'q-card answered-correct';
      userStats.correct++;
    } else {
      soundEngine.wrong();
      tag.className = 'status-tag err';
      tag.innerText = `❌ خطأ (الصحيح: ${q.risposta ? 'VERO' : 'FALSO'})`;
      card.className = 'q-card answered-wrong';
      userStats.wrong++;
      // Auto open explanation on mistake
      const drawer = document.getElementById(`drawer-${id}`);
      if (drawer) drawer.classList.add('open');
    }

    updateScoreDisplay();
  };

  window.toggleDrawer = function(id) {
    soundEngine.click();
    const drawer = document.getElementById(`drawer-${id}`);
    if (drawer) drawer.classList.toggle('open');
  };

  window.setFilter = function(f) {
    soundEngine.click();
    currentFilter = f;
    document.querySelectorAll('.f-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.f === f);
    });
    renderQuestions();
  };

  window.filterQuestions = function() {
    renderQuestions();
  };

  window.toggleStudyMode = function() {
    soundEngine.click();
    isStudyMode = document.getElementById('study-mode-toggle').checked;
    document.querySelectorAll('.study-badge-direct').forEach(b => {
      b.classList.toggle('show', isStudyMode);
    });
  };

  function updateScoreDisplay() {
    document.getElementById('stat-correct').innerText = userStats.correct;
    document.getElementById('stat-wrong').innerText = userStats.wrong;
    const remaining = Math.max(0, DATA.domande.length - (userStats.correct + userStats.wrong));
    document.getElementById('stat-remaining').innerText = remaining;
  }

  // Keyboard shortcut M for audio
  window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') toggleAudio();
  });

  // Initial render
  renderQuestions();
</script>
</body>
</html>
