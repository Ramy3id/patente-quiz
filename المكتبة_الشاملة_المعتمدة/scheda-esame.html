<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاكي الامتحان الوزاري الرسمي | Patente B Pro</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ch04_style.css">
  <style>
    /* أنماط Glassmorphic الخاصة بشاشة الامتحان الوزاري */
    .exam-portal-container {
      max-width: 960px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .exam-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 20px;
    }
    .exam-timer-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-warning {
      color: #EF4444 !important;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .exam-question-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .exam-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .exam-q-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }
    .exam-img-frame {
      max-width: 240px;
      margin: 0 auto 16px;
      text-align: center;
    }
    .exam-img-frame img {
      max-width: 100%;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
    }
    .exam-text-it {
      font-size: 20px;
      line-height: 1.6;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', 'Tajawal', sans-serif;
    }
    .exam-choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .choice-btn {
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .choice-btn-vero {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10B981;
    }
    .choice-btn-vero.selected {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .choice-btn-falso {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #EF4444;
    }
    .choice-btn-falso.selected {
      background: #EF4444;
      color: #FFFFFF;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    }
    .exam-nav-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .q-pill {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-pill.answered {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38BDF8;
      color: #FFFFFF;
    }
    .q-pill.active {
      outline: 2px solid #F59E0B;
      color: #FFFFFF;
    }
    .btn-submit-exam {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #38BDF8, #2563EB);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
    .mystery-reveal-box {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- شريط الملاحة الموحد 54px -->
  <nav class="unified-portal-nav">
    <div class="nav-content-inner">
      <div class="portal-brand">
        <a href="دليل_الباب_04_إشارات_الإلزام.html" class="brand-link">
          <span class="brand-title">Patente B Pro</span>
          <span class="ch-badge" style="background:#38BDF8; color:#0B0F19;">المحاكي الوزاري</span>
        </a>
      </div>
      <div class="portal-actions">
        <a href="دليل_الباب_04_إشارات_الإلزام.html" class="action-btn">📚 العودة للشرح</a>
      </div>
    </div>
  </nav>

  <div class="exam-portal-container">
    <div class="exam-top-bar">
      <div class="exam-timer-box" id="examTimerDisplay">⏱️ 20:00</div>
      <div style="font-weight:700; color:#94A3B8;">
        تمت الإجابة: <span id="answeredCounter" style="color:#38BDF8;">0</span> / 30
      </div>
    </div>

    <!-- شبكة أرقام الأسئلة للتنقل السريع -->
    <div class="exam-nav-pills" id="examPillsGrid"></div>

    <!-- بطاقة السؤال النشط -->
    <div class="exam-question-card" id="questionCardStage">
      <div style="text-align:center; padding:40px; color:#94A3B8;">جاري تحميل بنك الأسئلة الوزارية...</div>
    </div>

    <button type="button" class="btn-submit-exam" id="btnSubmitFinalExam">
      📤 تسليم الامتحان النهائي وتصحيح النتيجة
    </button>
  </div>

  <!-- تضمين المحركات المركزية النظيفة -->
  <script src="../assets/js/quiz-engine.js"></script>
  <script src="../assets/js/srs-engine.js"></script>
  <script src="../assets/js/audio-engine.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const exam = new PatenteExamEngine({
        totalQuestions: 30,
        durationMinutes: 20,
        onTick: (formattedTime, remainingSec) => {
          const tEl = document.getElementById("examTimerDisplay");
          if (tEl) {
            tEl.textContent = `⏱️ ${formattedTime}`;
            if (remainingSec <= 300) tEl.classList.add("timer-warning");
          }
        },
        onFinish: (result) => renderExamResults(result)
      });

      const srs = new PatenteSRSEngine();
      const audio = new PatenteAudioEngine();

      // جلب عينة أسئلة شاملة من ملفات الأبواب
      try {
        const res = await fetch("../assets/all_questions.json");
        const data = await res.json();
        const pool = data.domande || data;

        exam.loadQuestions(pool);
        exam.startTimer();
        renderActiveQuestion();
        renderPills();
      } catch (e) {
        document.getElementById("questionCardStage").innerHTML = `
          <div style="text-align:center; padding:30px; color:#EF4444;">
            ⚠️ تعذر تحميل ملف الأسئلة تلقائياً. تأكد من فتح الصفحة عبر خادم محلي أو داخل مجلد المشروع.
          </div>
        `;
      }

      function renderPills() {
        const grid = document.getElementById("examPillsGrid");
        if (!grid) return;
        grid.innerHTML = exam.questions.map((q, idx) => `
          <div class="q-pill ${exam.currentIndex === idx ? 'active' : ''} ${exam.answers[q.id] !== undefined ? 'answered' : ''}" 
               data-idx="${idx}">
            ${idx + 1}
          </div>
        `).join("");

        grid.querySelectorAll(".q-pill").forEach(p => {
          p.addEventListener("click", () => {
            exam.goToQuestion(parseInt(p.dataset.idx));
            renderActiveQuestion();
            renderPills();
          });
        });
      }

      function renderActiveQuestion() {
        const q = exam.getCurrentQuestion();
        if (!q) return;

        const currentAnswer = exam.answers[q.id];
        const stage = document.getElementById("questionCardStage");

        stage.innerHTML = `
          <div class="exam-q-header">
            <span class="exam-q-badge">سؤال رقم ${exam.currentIndex + 1} من 30</span>
            <span style="font-size:13px; color:#94A3B8;">ID: ${q.id}</span>
          </div>

          ${q.immagine ? `<div class="exam-img-frame"><img src="../${q.immagine}" alt="Segnale"></div>` : ""}

          <div class="exam-text-it">${q.domanda}</div>

          <div class="exam-choice-buttons">
            <button type="button" class="choice-btn choice-btn-vero ${currentAnswer === true ? 'selected' : ''}" id="btnVero">
              VERO (صح)
            </button>
            <button type="button" class="choice-btn choice-btn-falso ${currentAnswer === false ? 'selected' : ''}" id="btnFalso">
              FALSO (خطأ)
            </button>
          </div>

          <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button type="button" class="action-btn" id="btnPrev" ${exam.currentIndex === 0 ? 'disabled' : ''}>السابق</button>
            <button type="button" class="action-btn" id="btnNext" ${exam.currentIndex === exam.questions.length - 1 ? 'disabled' : ''}>التالي</button>
          </div>
        `;

        document.getElementById("answeredCounter").textContent = exam.getAnsweredCount();

        // ربط أزرار الإجابة
        document.getElementById("btnVero").addEventListener("click", () => {
          exam.recordAnswer(q.id, true);
          audio.playFeedbackTone("click");
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnFalso").addEventListener("click", () => {
          exam.recordAnswer(q.id, false);
          audio.playFeedbackTone("click");
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnNext").addEventListener("click", () => {
          exam.nextQuestion();
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnPrev").addEventListener("click", () => {
          exam.prevQuestion();
          renderActiveQuestion();
          renderPills();
        });
      }

      document.getElementById("btnSubmitFinalExam").addEventListener("click", () => {
        const remaining = 30 - exam.getAnsweredCount();
        if (remaining > 0 && !confirm(`لديك ${remaining} سؤالاً لم تجب عليه بعد. هل تريد تسليم الامتحان الآن؟`)) {
          return;
        }
        exam.submitExam("USER_SUBMIT");
      });

      function renderExamResults(result) {
        // تسجيل الأخطاء في SRS
        result.details.forEach(item => {
          if (!item.isCorrect) {
            srs.logQuestionAttempt(item, false);
          }
        });

        const container = document.querySelector(".exam-portal-container");
        container.innerHTML = `
          <div class="exam-question-card" style="text-align:center;">
            <div style="font-size:48px; margin-bottom:12px;">${result.passed ? "🎉" : "❌"}</div>
            <h2 style="color:${result.passed ? "#10B981" : "#EF4444"}; font-size:28px; margin-bottom:8px;">
              ${result.passed ? "مبروك! ناجح في الامتحان الوزاري" : "للأسف، لم تتجاوز الامتحان (راسب)"}
            </h2>
            <p style="color:#94A3B8; font-size:18px; margin-bottom:24px;">
              عدد الأخطاء: <strong style="color:${result.errors <= 3 ? '#10B981' : '#EF4444'}">${result.errors}</strong> (الحد الأقصى المسموح به 3 أخطاء)
            </p>

            <h3 style="text-align:right; margin:30px 0 16px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
              🔍 كشف الألغاز وتحليل الأسئلة الخاطئة:
            </h3>

            <div style="text-align:right;">
              ${result.details.map(d => `
                <div style="background:rgba(255,255,255,0.03); border:1px solid ${d.isCorrect ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}; border-radius:14px; padding:16px; margin-bottom:14px;">
                  <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span style="font-weight:700;">سؤال #${d.index}</span>
                    <span style="color:${d.isCorrect ? '#10B981' : '#EF4444'}; font-weight:700;">
                      ${d.isCorrect ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة"} (إجابتك: ${d.userAnswer === null ? 'متروك' : (d.userAnswer ? 'V' : 'F')} | الصحيح: ${d.correctAnswer ? 'V' : 'F'})
                    </span>
                  </div>
                  <div style="font-weight:700; margin-bottom:8px; color:#FFFFFF;">${d.domanda}</div>
                  <div style="color:#38BDF8; font-size:14px; margin-bottom:6px;">📖 الترجمة: ${d.traduzione}</div>
                  <div style="color:#94A3B8; font-size:13px; margin-bottom:6px;">💡 الشرح: ${d.spiegazione}</div>
                  ${d.trabocchetto ? `<div class="mystery-reveal-box">⚠️ فخ الامتحان: ${d.trabocchetto}</div>` : ""}
                </div>
              `).join("")}
            </div>

            <a href="scheda-esame.html" class="btn-submit-exam" style="display:inline-block; margin-top:20px; text-decoration:none;">
              🔄 إجراء امتحان وزاري جديد
            </a>
          </div>
        `;
      }
    });

    // تسجيل السيرفيس وركر لدعم التشغيل أوفلاين
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../service-worker.js').catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
