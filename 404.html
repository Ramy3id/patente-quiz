<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — الصفحة غير موجودة | Patente B Pro</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    :root {
      --bg-page: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --accent: #0284C7;
      --accent-glow: rgba(2, 132, 199, 0.15);
      --border-color: rgba(15, 23, 42, 0.1);
    }
    html:not(.light) {
      --bg-page: #0B0F19;
      --card-bg: #111827;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .error-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.15), 0 4px 12px rgba(15, 23, 42, 0.05);
      position: relative;
      overflow: hidden;
    }

    .error-badge-404 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #EF4444 0%, #F59E0B 50%, #10B981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -2px;
    }

    .error-emoji {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: floatEmoji 3s ease-in-out infinite;
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .error-desc-it {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      direction: ltr;
      margin-top: 4px;
    }

    .search-box-404 {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(15, 23, 42, 0.03);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }
    html:not(.light) .search-box-404 {
      background: rgba(255, 255, 255, 0.04);
    }

    .search-input-404 {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
    }

    .search-btn-404 {
      background: var(--accent);
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .search-btn-404:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .quick-link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    html:not(.light) .quick-link-btn {
      background: rgba(255, 255, 255, 0.04);
    }
    .quick-link-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-home-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFF;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-home-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.45);
    }

    @media (max-width: 480px) {
      .error-card { padding: 30px 20px; }
      .quick-links-grid { grid-template-columns: 1fr; }
      .error-badge-404 { font-size: 4.2rem; }
    }
  </style>
</head>
<body>

  <!-- الهيدر الموحد التلقائي -->
  <div id="unified-header"></div>

  <main class="error-container">
    <div class="error-card">
      <div class="error-emoji">🚦⚠️</div>
      <div class="error-badge-404">404</div>
      <h1 class="error-title">عفواً.. يبدو أنك دخلت طريقاً مسدوداً!</h1>
      <p class="error-desc">
        الصفحة التي تبحث عنها غير موجودة أو تم تغيير مسارها لتحديث المنهج.
        <span class="error-desc-it">Pagina non trovata o spostata.</span>
      </p>

      <!-- محرك بحث سريع للوصول للباب أو المصطلح -->
      <form class="search-box-404" onsubmit="handleSearch(event)">
        <input type="text" id="errorSearchInput" class="search-input-404" placeholder="ابحث عن أي باب، إشارة أو مصطلح..." autocomplete="off">
        <button type="submit" class="search-btn-404">🔍 ابحث</button>
      </form>

      <!-- روابط سريعة للوجهات الرئيسية -->
      <div class="quick-links-grid">
        <a href="/Capitoli_Divisi/index.html" class="quick-link-btn">
          <span>📚</span>
          <span>فهرس الأبواب (1-25)</span>
        </a>
        <a href="/interactive_pages/scheda-esame.html" class="quick-link-btn">
          <span>⏱️</span>
          <span>محاكي الامتحان الرسمي</span>
        </a>
        <a href="/interactive_pages/decodificatore-incroci.html" class="quick-link-btn">
          <span>🔄</span>
          <span>مفكك التقاطعات</span>
        </a>
        <a href="/interactive_pages/dashboard.html" class="quick-link-btn">
          <span>📊</span>
          <span>لوحة الإنجاز وأخطائي</span>
        </a>
      </div>

      <a href="/index.html" class="btn-home-main">
        <span>🏠</span>
        <span>العودة إلى الصفحة الرئيسية للرخصة</span>
      </a>
    </div>
  </main>

  <script src="/assets/js/theme-engine.js"></script>
  <script src="/assets/js/unified-nav.js"></script>
  <script>
    function handleSearch(e) {
      e.preventDefault();
      const val = document.getElementById('errorSearchInput').value.trim();
      if (!val) return;
      // فتح محرك البحث الفوري العام
      if (window.openGlobalSearchModal) {
        window.openGlobalSearchModal(val);
      } else {
        window.location.href = '/interactive_pages/cerca-quiz.html?q=' + encodeURIComponent(val);
      }
    }
  </script>
</body>
</html>
