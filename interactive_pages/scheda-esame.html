  max-height: 120px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}
@media (min-width: 769px) {
  .moto-sign-img {
    max-height: 200px;
  }
}
.moto-question-panel {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.moto-q-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.moto-q-num-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem !important;
  font-weight: 900 !important;
  color: #F8FAFC !important;
  background: #334155;
  padding: 0 10px !important;
  height: 28px !important;
  min-height: 28px !important;
  max-height: 28px !important;
  border-radius: 6px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-sizing: border-box !important;
  line-height: 1 !important;
}
.moto-text-italian {
  font-size: 1.15rem;
  font-weight: 800;
  color: #FFFFFF !important;
  line-height: 1.45;
  margin-bottom: 10px;
}
.moto-arabic-helper {
  font-size: 0.90rem;
  color: #94A3B8 !important;
  direction: rtl;
  text-align: right;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 12px;
}

/* زري اللمس الوزاريين العملاقين */
.moto-touch-buttons-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-moto-touch {
  height: 58px;
  border-radius: 12px;
  border: 3px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'JetBrains Mono', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  transition: all 0.12s ease;
  color: #FFFFFF !important;
}
.btn-moto-touch.v {
  background: #0284C7;
  border-color: #38BDF8;
}
.btn-moto-touch.v:hover, .btn-moto-touch.v.selected {
  background: #0369A1;
  border-color: #FFFFFF;
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
  transform: scale(0.98);
}
.btn-moto-touch.f {
  background: #DC2626;
  border-color: #F87171;
}
.btn-moto-touch.f:hover, .btn-moto-touch.f.selected {
  background: #B91C1C;
  border-color: #FFFFFF;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
  transform: scale(0.98);
}

/* لوحة التحكم السفلية وشبكة الـ 30 سؤالاً في الموتوريزاسيون */
.moto-bottom-controls {
  background: #0F172A;
  border-top: 2px solid #334155;
  padding: 12px 14px;
}
.moto-nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.btn-moto-step {
  padding: 8px 14px;
  border-radius: 8px;
  background: #334155;
  border: 2px solid #475569;
  color: #FFFFFF !important;
  font-weight: 800;
  font-size: 0.88rem;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.moto-summary-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 4px;
  line-height: 1.15;
  min-width: 76px;
  user-select: none;
}
.moto-summary-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.70rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #94A3B8;
  text-transform: uppercase;
  display: block;
}
.moto-summary-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.95rem;
  font-weight: 800;
  color: #38BDF8;
  display: block;
  margin-top: 1px;
}
.moto-summary-count strong {
  font-size: 1.05rem;
  font-weight: 900;
  color: #FFFFFF;
}
.btn-moto-step:hover:not(:disabled) {
  background: #475569;
  border-color: #38BDF8;
}
.btn-moto-step:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-moto-flag {
  padding: 0 10px !important;
  height: 28px !important;
  min-height: unset !important;
  max-height: 28px !important;
  border-radius: 6px !important;
  background: rgba(245, 158, 11, 0.15) !important;
  border: 1.5px solid #F59E0B !important;
  color: #FBBF24 !important;
  font-weight: 800 !important;
  font-size: 0.80rem !important;
  cursor: pointer !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 5px !important;
  font-family: 'JetBrains Mono', inherit !important;
  box-sizing: border-box !important;
  line-height: 1 !important;
}
.btn-moto-flag.active {
  background: #F59E0B;
  color: #0F172A !important;
}

/* مصفوفة الـ 30 الرسمية */
.moto-matrix-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  margin-bottom: 12px;
}
@media (min-width: 769px) {
  .moto-matrix-grid { grid-template-columns: repeat(15, 1fr); gap: 6px; }
}
.moto-cell {
  height: 36px;
  border-radius: 6px;
  background: #1E293B;
  border: 2px solid #334155;
  color: #94A3B8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88rem;
  font-weight: 800;
  cursor: pointer;
  position: relative;
}
.moto-cell:hover { border-color: #38BDF8; }
.moto-cell.active {
  border-color: #FFFFFF !important;
  box-shadow: 0 0 10px #FFFFFF;
}
.moto-cell.v {
  background: #0284C7;
  color: #FFFFFF !important;
  border-color: #38BDF8;
}
.moto-cell.f {
  background: #DC2626;
  color: #FFFFFF !important;
  border-color: #F87171;
}
.moto-cell.flagged::after {
  content: '▲';
  position: absolute;
  top: 1px;
  right: 3px;
  font-size: 0.55rem;
  color: #FBBF24;
}
.btn-moto-conclude {
  width: 100%;
  height: 48px;
  border-radius: 10px;
  background: #DC2626;
  border: none;
  color: #FFFFFF !important;
  font-family: 'JetBrains Mono', sans-serif;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.2s ease;
}
.btn-moto-conclude:hover {
  background: #B91C1C;
  box-shadow: 0 0 24px rgba(220, 38, 38, 0.55);
}

    /* =========================================================
       FIXED-SLOT QUESTION CARD (Zero Layout Shift)
       ========================================================= */
    .exam-question-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 16px 16px 28px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      margin-bottom: 14px;
    }
    html.light .exam-question-card {
      background: #FFFFFF;
      border-color: rgba(15, 23, 42, 0.1);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .exam-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 34px;
      box-sizing: border-box;
    }
    html.light .exam-q-header { border-bottom-color: rgba(15, 23, 42, 0.08); }
    .exam-q-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
    }


    /* Fixed Media Slot (120px) to prevent vertical bouncing */
    .exam-media-slot {
      height: 95px;
      max-height: 95px;
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }
    .exam-sign-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }
    .exam-sign-frame img {
      max-height: 90px;
      max-width: 210px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #FFFFFF;
      padding: 2px;
    }
    .exam-no-img-placeholder {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      color: #94A3B8;
      font-size: 0.74rem;
      font-weight: 600;
    }
    html.light .exam-no-img-placeholder {
      background: #F8FAFC;
      border-color: #E2E8F0;
      color: #64748B;
    }
    .no-img-icon {
      font-size: 1.15rem;
    }

    /* Fixed Height Question Text Zone (Zero layout shift, no top clipping) */
    .exam-text-container {
      height: 190px;
      min-height: 190px;
      max-height: 190px;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      margin: 2px 0;
      text-align: center;
      padding: 2px 6px;
      box-sizing: border-box;
    }
    .exam-text-container::-webkit-scrollbar {
      display: none !important;
    }
    .exam-text-it {
      font-size: 0.93rem;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.3;
      margin: 0 0 2px;
      direction: ltr;
      text-align: center;
      max-height: 68px;
    }
    html.light .exam-text-it { color: #0F172A; }

    .exam-tr-wrapper {
      margin-top: 2px;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }
    .btn-toggle-tr {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px !important;
      height: 24px !important;
      min-height: 24px !important;
      max-height: 24px !important;
      padding: 0 10px !important;
      border-radius: 999px !important;
      font-size: 0.74rem !important;
      font-weight: 700 !important;
      background: rgba(56, 189, 248, 0.08) !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      color: #0284C7 !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
      font-family: inherit !important;
      box-sizing: border-box !important;
      line-height: 1 !important;
    }
    html:not(.light) .btn-toggle-tr {
      background: rgba(56, 189, 248, 0.12) !important;
      border-color: rgba(56, 189, 248, 0.3) !important;
      color: #38BDF8 !important;
    }
    .btn-toggle-tr.active {
      background: rgba(148, 163, 184, 0.14) !important;
      border-color: rgba(148, 163, 184, 0.3) !important;
      color: #475569 !important;
    }
    html:not(.light) .btn-toggle-tr.active {
      color: #CBD5E1 !important;
    }
    .exam-text-tr {
      font-size: 0.82rem;
      font-weight: 600;
      color: #CBD5E1;
      line-height: 1.28;
      direction: rtl;
      text-align: center;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      animation: fadeInTr 0.15s ease-out;
    }
    html.light .exam-text-tr {
      color: #334155;
      background: #F8FAFC;
      border-color: #E2E8F0;
    }
    @keyframes fadeInTr {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Choice Buttons: Fixed Thumb-Zone Height (52px) */
    .exam-choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 6px 0;
    }
    .choice-btn {
      height: 52px !important;
      min-height: 52px !important;
      max-height: 52px !important;
      padding: 0 12px !important;
      font-size: 1.1rem !important;
      font-weight: 800 !important;
      border-radius: 14px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }
    .choice-btn.selected {
      transform: scale(0.98);
      filter: brightness(1.15);
    }

    /* Navigation Steps Bar */
    .exam-nav-steps {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      margin-bottom: 2px;
      padding: 0 4px;
      height: 40px;
      border-top: none !important;
    }
    .btn-submit-pill {
      height: 36px !important;
      min-height: 36px !important;
      padding: 0 10px !important;
      border-radius: 8px !important;
      background: linear-gradient(135deg, #10B981, #059669) !important;
      border: none !important;
      color: #FFFFFF !important;
      font-weight: 800 !important;
      font-size: 0.8rem !important;
      cursor: pointer !important;
      white-space: nowrap !important;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25) !important;
      font-family: inherit !important;
      display: inline-flex !important;
      align-items: center !important;

      }
    }

</style>
</head>
<body>

  <div class="exam-portal-container">
    <!-- =========================================================
         0. شريط التحكم العلوي الموحد والثابت 100% بين جميع الأوضاع
         (Universal Master Exam Header - Zero Layout Shift Switcher)
         ========================================================= -->
    <div class="exam-control-hub" id="examMasterControlHub">
      <div class="hub-primary-row">
        <!-- زر التبديل العصري والرسمي (مكان ثابت 100% لا يتحرك مليمتر واحد أبداً) -->
        <div class="exam-skin-switcher-mini" id="masterSkinSwitcher">
          <button type="button" class="skin-btn-mini active btn-skin-modern-sync" id="btnSkinModern" title="الوضع العصري الفاخر">
            <span>🌟 عصري</span>
          </button>
          <button type="button" class="skin-btn-mini btn-skin-moto-sync" id="btnSkinMoto" title="شاشة كمبيوتر المرور">
            <span>🖥️ رسمي</span>
          </button>

        <!-- عداد الإنجاز الموحد -->

        <div class="exam-nav-pills" id="examPillsGrid"></div>
      </div>

      <div class="exam-question-card" id="questionCardStage">
        <div style="text-align:center; padding:40px; color:#94A3B8;">جاري إعداد بطاقة الامتحان الوزاري المعتمد...</div>
      </div>

      <!-- زر تسليم احتياطي للشاشات الكبيرة -->
      <button type="button" class="btn-submit-exam" id="btnSubmitFinalExam" style="display:none;">

    <!-- =========================================================
         2. واجهة شاشة كمبيوتر المرور الرسمية (Motorizzazione Skin)

    <div class="motorizzazione-screen-wrap" id="motoScreenWrap">
      <div class="moto-top-header">

          <div class="moto-titles-text">

        <div class="moto-timer-badge" id="motoTimerBadge">⏱️ 20:00</div>

      <div class="moto-main-terminal">
        <!-- لوحة صورة الإشارة الرسمية الثابتة -->
        <div class="moto-sign-panel" id="motoSignBox">

          <div id="motoNoSignPlaceholder" class="moto-no-sign-official">
            🚗 QUESITO TEORICO • SENZA FIGURA
          </div>
        </div>

        <!-- لوحة نص السؤال الإيطالي الرسمي بدون ترجمة وأزرار اللمس -->
        <div class="moto-question-panel">
          <div>
            <div class="moto-q-meta-row">
              <span class="moto-q-num-badge" id="motoQuestionBadge">DOMANDA N. 1 DI 30</span>
              <button class="btn-moto-flag" id="btnMotoFlag">
                <span>📌</span>
                <span>DA RIVEDERE</span>
              </button>

            <div class="moto-text-italian" id="motoQuestionText">Caricamento testo ufficiale...</div>
          </div>

          <div class="moto-touch-buttons-grid">

              <span>V</span>

      <div class="moto-bottom-controls">

          <div class="moto-summary-box" id="motoSummaryAnswered">
            <span class="moto-summary-label">RISPOSTE</span>
            <span class="moto-summary-count"><strong id="motoAnsweredCount">0</strong> / 30</span>
          </div>
          <button class="btn-moto-step" id="btnMotoNext">SUCCESSIVO ▶</button>
        </div>

        <div class="moto-matrix-grid" id="motoMatrixGrid">
          <!-- 30 official cells generated dynamically -->
        </div>

          CONFERMA E CONSEGNA SCHEDA D'ESAME ➡
        </button>

  <script>
    function resolveImgPath(img) {
      if (!img || typeof img !== 'string' || !img.trim()) return null;
      if (img.startsWith('http') || img.startsWith('../')) return img;
      if (img.includes('Capitolo_')) return `../Capitoli_Divisi/${img}`;
      const filename = img.split('/').pop().trim();
      return filename ? `../img_sign/${filename}` : null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      let currentSkin = localStorage.getItem('patente_exam_skin') || 'modern';
      const flaggedQuestions = new Set();
      let showArabicTr = false; // للأسئلة المعلمة بـ Da rivedere

      const exam = new PatenteExamEngine({
        totalQuestions: 30,
        durationMinutes: 20,
        onTick: (formattedTime, remainingSec) => {
          const tEl = document.getElementById("examTimerDisplay");
          const motoTimer = document.getElementById("motoTimerBadge");
          if (tEl) {
            tEl.textContent = `⏱️ ${formattedTime}`;
            tEl.classList.toggle("timer-warning", remainingSec <= 300);
          }
          if (motoTimer) {
            motoTimer.textContent = `⏱️ ${formattedTime}`;
            motoTimer.classList.toggle("warning", remainingSec <= 300);
          }
        },
        onFinish: (result) => renderExamResults(result)
      });
      window.exam = exam;

      const srs = typeof PatenteSRSEngine === 'function' ? new PatenteSRSEngine() : null;
      const audio = typeof PatenteAudioEngine === 'function' ? new PatenteAudioEngine() : null;

      // تبديل المظهر Skin بمزامنة زر ON / OFF في كلا الوضعين
      function setSkin(skin) {
        currentSkin = skin;
        localStorage.setItem('patente_exam_skin', skin);
        document.body.classList.toggle('skin-moto', skin === 'motorizzazione');
        
        document.querySelectorAll('.btn-skin-modern-sync').forEach(b => {
          b.classList.toggle('active', skin === 'modern');
        });
        document.querySelectorAll('.btn-skin-moto-sync').forEach(b => {
          b.classList.toggle('active', skin === 'motorizzazione');
        });
        
        renderActiveQuestion();
        renderPills();
      }

      document.querySelectorAll('.btn-skin-modern-sync').forEach(b => {
        b.addEventListener('click', () => setSkin('modern'));
      });
      document.querySelectorAll('.btn-skin-moto-sync').forEach(b => {
        b.addEventListener('click', () => setSkin('motorizzazione'));
      });

      // تحميل الأسئلة
      try {
        let pool = [];
        if (window.ALL_QUESTIONS_DATA && Array.isArray(window.ALL_QUESTIONS_DATA) && window.ALL_QUESTIONS_DATA.length > 0) {
          pool = window.ALL_QUESTIONS_DATA.map(q => ({
            id: q.id,
            domanda: q.q,
            risposta: q.a,
            immagine: q.img,
            img: q.img,
            traduzione: q.tr,
            spiegazione: q.sp,
            trabocchetto: q.tb,
            parole_chiave: q.pk,
            capitolo_num: q.ch || 1
          }));
        } else {
          const res = await fetch("../assets/all_questions.json");
          const data = await res.json();
          pool = data.domande || data;
        }

        exam.loadQuestions(pool);
        window.renderActiveQuestion = renderActiveQuestion;
        window.renderPills = renderPills;
        exam.startTimer();
        setSkin(currentSkin);
      } catch (e) {
        document.getElementById("questionCardStage").innerHTML = `
          <div style="text-align:center; padding:30px; color:#EF4444;">
            ⚠️ تعذر تحميل بنك الأسئلة تلقائياً.
          </div>
        `;
      }

      // رسم شبكة الأسئلة
      function renderPills() {
        const grid = document.getElementById("examPillsGrid");
        const motoGrid = document.getElementById("motoMatrixGrid");

        // 1. الشبكة العصرية
        if (grid) {
          grid.innerHTML = exam.questions.map((q, idx) => {
            const isAns = (exam.answers[q.id] !== undefined);
            const isFlag = flaggedQuestions.has(q.id);
            const isCur = (exam.currentIndex === idx);
            return `
              <div class="q-pill ${isCur ? 'active' : ''} ${isAns ? 'answered' : ''} ${isFlag ? 'flagged' : ''}" data-idx="${idx}">
                ${idx + 1}
              </div>
            `;
          }).join("");

          grid.querySelectorAll(".q-pill").forEach(p => {
            p.addEventListener("click", () => {
              exam.goToQuestion(parseInt(p.dataset.idx));
              renderActiveQuestion();
              renderPills();
            });
          });

          // Scroll active pill into center smoothly
          const curPill = grid.querySelector('.q-pill.active');
          if (curPill && curPill.scrollIntoView) {
            curPill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        }

        // 2. شبكة الموتوريزاسيون
        if (motoGrid) {
          motoGrid.innerHTML = exam.questions.map((q, idx) => {
            const ans = exam.answers[q.id];
            const isFlag = flaggedQuestions.has(q.id);
            const isCur = (exam.currentIndex === idx);
            let stateClass = '';
            let label = idx + 1;
            if (ans === true) { stateClass = 'v'; label = `${idx + 1} V`; }
            else if (ans === false) { stateClass = 'f'; label = `${idx + 1} F`; }

            return `
              <div class="moto-cell ${isCur ? 'active' : ''} ${stateClass} ${isFlag ? 'flagged' : ''}" data-idx="${idx}">
                ${label}
              </div>
            `;
          }).join("");

          motoGrid.querySelectorAll(".moto-cell").forEach(c => {
            c.addEventListener("click", () => {
              exam.goToQuestion(parseInt(c.dataset.idx));
              renderActiveQuestion();
              renderPills();
            });
          });

          // Scroll active pill into center smoothly
          const curPill = grid.querySelector('.q-pill.active');
          if (curPill && curPill.scrollIntoView) {
            curPill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        }

        const count = exam.getAnsweredCount();
        const ansCnt = document.getElementById("answeredCounter");
        const motoCountEl = document.getElementById("motoAnsweredCount");
        if (ansCnt) ansCnt.textContent = count;
        if (motoCountEl) {
          motoCountEl.textContent = count;
        } else {
          const motoAnsCnt = document.getElementById("motoSummaryAnswered");
          if (motoAnsCnt) motoAnsCnt.innerHTML = `<span class="moto-summary-label">RISPOSTE</span><span class="moto-summary-count"><strong>${count}</strong> / 30</span>`;
        }
      }

      // رسم السؤال النشط
      function renderActiveQuestion() {
        const q = exam.getCurrentQuestion();
        if (!q) return;

        const currentAnswer = exam.answers[q.id];
        const isFlag = flaggedQuestions.has(q.id);
        const rawImg = (q.img || q.immagine || "").trim();
        const imgPath = resolveImgPath(rawImg);

        // 1. تحديث واجهة الوضع العصري
        const stage = document.getElementById("questionCardStage");
        if (stage) {
          stage.innerHTML = `
            <div class="exam-q-header">
              <span class="exam-q-badge">سؤال ${exam.currentIndex + 1} من 30</span>
              <button type="button" class="btn-flag-review ${isFlag ? 'active' : ''}" id="btnModernFlag">
                <span>${isFlag ? '📌 معلّم للمراجعة' : '📌 علّم للمراجعة'}</span>
              </button>
            </div>

            <!-- حاوية الصورة الثابتة: ارتفاع 120px دائماً لمنع قفز الأزرار -->
            <div class="exam-media-slot">
              ${imgPath ? 
                `<div class="exam-sign-frame"><img src="${imgPath}" alt="Segnale"></div>` : 
                `<div class="exam-no-img-placeholder">
                   <span class="no-img-icon">🚗</span>
                   <span class="no-img-label">سؤال نظري عام • بدون إشارة مصورة</span>
                 </div>`
              }
            </div>

            <!-- حاوية نصوص السؤال ذات الارتفاع المتناسق -->
            <div class="exam-text-container">
              <div class="exam-text-it">${q.domanda}</div>
              <div class="exam-tr-wrapper">
                <button type="button" class="btn-toggle-tr ${showArabicTr ? 'active' : ''}" id="btnToggleTr">
                  <span>${showArabicTr ? '✕ إخفاء الترجمة' : '🌐 الترجمة العربية'}</span>
                </button>
                <div class="exam-text-tr" id="examArabicText" style="display:${showArabicTr ? 'block' : 'none'};">
                  ${q.traduzione || 'سؤال وزاري مباشر.'}
                </div>
              </div>
            </div>

            <!-- أزرار الإجابة الثابتة في منطقة راحة الإبهام -->
            <div class="exam-choice-buttons">
              <button type="button" class="choice-btn choice-btn-vero ${currentAnswer === true ? 'selected' : ''}" id="btnVero">
                <span>VERO (صح) ☑</span>
              </button>
              <button type="button" class="choice-btn choice-btn-falso ${currentAnswer === false ? 'selected' : ''}" id="btnFalso">
                <span>FALSO (خطأ) ✕</span>
              </button>
            </div>

            <!-- أزرار التنقل السفلية -->
            <div class="exam-nav-steps">
              <button type="button" class="btn-nav-step" id="btnPrev" ${exam.currentIndex === 0 ? 'disabled' : ''}>السابق ➡</button>
              <button type="button" class="btn-submit-pill" id="btnModernSubmit">📋 تسليم الامتحان</button>
              <button type="button" class="btn-nav-step" id="btnNext" ${exam.currentIndex === exam.questions.length - 1 ? 'disabled' : ''}>التالي ⬅</button>
            </div>
          `;

          document.getElementById("btnVero").addEventListener("click", () => answerAndRefresh(q.id, true));
          document.getElementById("btnFalso").addEventListener("click", () => answerAndRefresh(q.id, false));
          document.getElementById("btnNext").addEventListener("click", () => { exam.nextQuestion(); renderActiveQuestion(); renderPills(); });
          document.getElementById("btnPrev").addEventListener("click", () => { exam.prevQuestion(); renderActiveQuestion(); renderPills(); });
          document.getElementById("btnModernFlag").addEventListener("click", () => toggleFlag(q.id));
          document.getElementById("btnToggleTr")?.addEventListener("click", () => {
            showArabicTr = !showArabicTr;
            const trBox = document.getElementById("examArabicText");
            const trBtn = document.getElementById("btnToggleTr");
            if (trBox && trBtn) {
              trBox.style.display = showArabicTr ? "block" : "none";
              trBtn.classList.toggle("active", showArabicTr);
              trBtn.innerHTML = `<span>${showArabicTr ? "✕ إخفاء الترجمة" : "🌐 الترجمة العربية"}</span>`;
            }
          });
        }

        // 2. تحديث واجهة كمبيوتر الموتوريزاسيون (Official Motorizzazione)
        const motoBox = document.getElementById("motoSignBox");
        const motoImg = document.getElementById("motoSignImg");
        const motoNoSign = document.getElementById("motoNoSignPlaceholder");
        const motoText = document.getElementById("motoQuestionText");
        const motoBadge = document.getElementById("motoQuestionBadge");
        const motoFlagBtn = document.getElementById("btnMotoFlag");
        const motoV = document.getElementById("btnMotoVero");
        const motoF = document.getElementById("btnMotoFalso");

        if (motoBadge) motoBadge.textContent = `DOMANDA N. ${exam.currentIndex + 1} DI 30`;
        if (motoText) motoText.textContent = q.domanda;

        if (motoImg && motoNoSign) {
          if (imgPath) {
            motoImg.src = imgPath;
            motoImg.style.display = 'block';
            motoNoSign.style.display = 'none';
          } else {
            motoImg.src = '';
            motoImg.style.display = 'none';
            motoNoSign.style.display = 'flex';
          }
        }

        if (motoFlagBtn) {
          motoFlagBtn.classList.toggle('active', isFlag);
          motoFlagBtn.onclick = () => toggleFlag(q.id);
        }

        if (motoV && motoF) {
          motoV.classList.toggle('selected', currentAnswer === true);
          motoF.classList.toggle('selected', currentAnswer === false);
          motoV.onclick = () => answerAndRefresh(q.id, true);
          motoF.onclick = () => answerAndRefresh(q.id, false);
        }

        const motoNext = document.getElementById("btnMotoNext");
        const motoPrev = document.getElementById("btnMotoPrev");
        if (motoNext) {
          motoNext.disabled = (exam.currentIndex === exam.questions.length - 1);
          motoNext.onclick = () => { exam.nextQuestion(); renderActiveQuestion(); renderPills(); };
        }
        if (motoPrev) {
          motoPrev.disabled = (exam.currentIndex === 0);
          motoPrev.onclick = () => { exam.prevQuestion(); renderActiveQuestion(); renderPills(); };
        }
      }

      let _autoAdvanceTimer = null;
      function answerAndRefresh(qid, choice) {
        exam.recordAnswer(qid, choice);
        if (audio && typeof audio.playFeedbackTone === 'function') {
          audio.playFeedbackTone("click");
        }
        renderActiveQuestion();
        renderPills();

        // تفعيل الانتقال التلقائي الفوري للسؤال التالي (Auto-advance 220ms)
        if (_autoAdvanceTimer) clearTimeout(_autoAdvanceTimer);
        if (exam.currentIndex < exam.questions.length - 1) {
          _autoAdvanceTimer = setTimeout(() => {
            exam.nextQuestion();
            renderActiveQuestion();
            renderPills();
          }, 220);
        } else {
          // وميض زر التسليم عند اكتمال السؤال الأخير
          const sBtns = [document.getElementById("btnModernSubmit"), document.getElementById("btnQuickSubmit")];
          sBtns.forEach(b => {
            if (b) {
              b.style.transform = 'scale(1.08)';
              setTimeout(() => { b.style.transform = ''; }, 300);
            }
          });
        }
      }

      function toggleFlag(qid) {
        if (flaggedQuestions.has(qid)) flaggedQuestions.delete(qid);
        else flaggedQuestions.add(qid);
        renderActiveQuestion();
        renderPills();
      }

      // تسليم الامتحان
      function confirmAndSubmit() {
        const remaining = 30 - exam.getAnsweredCount();
        const flaggedCount = flaggedQuestions.size;
        let warning = '';
        if (remaining > 0) warning += `⚠️ تنبيه: لديك ${remaining} سؤالاً لم تجب عليه بعد!\n`;
        if (flaggedCount > 0) warning += `📌 لديك ${flaggedCount} سؤالاً تم تعليمه للمراجعة.\n`;
        warning += '\nهل أنت متأكد من رغبتك في تسليم بطاقة الامتحان الوزاري الآن وتصحيح النتيجة؟';

        if (confirm(warning)) {
          exam.submitExam("USER_SUBMIT");
        }
      }

      const btnSub = document.getElementById("btnSubmitFinalExam");
      if (btnSub) btnSub.addEventListener("click", confirmAndSubmit);
      const btnQuick = document.getElementById("btnQuickSubmit");
      if (btnQuick) btnQuick.addEventListener("click", confirmAndSubmit);
      const btnMoto = document.getElementById("btnMotoConclude");
      if (btnMoto) btnMoto.addEventListener("click", confirmAndSubmit);
      document.addEventListener("click", (e) => {
        if (e.target && e.target.id === "btnModernSubmit") confirmAndSubmit();
      });

      // عرض النتيجة
      function renderExamResults(result) {
        // حفظ في سجل localStorage
        const history = JSON.parse(localStorage.getItem("patente_exam_history") || "[]");
        history.push({
          date: new Date().toLocaleDateString('ar-EG'),
          passed: result.passed,
          errors: result.errorsCount,
          duration: `${Math.floor((1200 - exam.remainingSeconds)/60)} دقيقة`
        });
        localStorage.setItem("patente_exam_history", JSON.stringify(history));

        // تسجيل الأخطاء في SRS
        if (srs) {
          result.details.forEach(item => {
            if (!item.isCorrect) srs.logQuestionAttempt(item, false);
          });
        }

        // تحديث شارات الهيدر واللوحة
        if (typeof window.updatePortalProgress === 'function') {
          window.updatePortalProgress();
        }

        const container = document.querySelector(".exam-portal-container");
        container.innerHTML = `
          <div class="exam-question-card" style="text-align:center;">
            <div style="font-size:54px; margin-bottom:12px;">${result.passed ? "🎉" : "❌"}</div>
            <h2 style="color:${result.passed ? "#10B981" : "#EF4444"}; font-size:28px; margin-bottom:8px; font-weight:800;">
              ${result.passed ? "مبروك! ناجح في الامتحان الوزاري" : "للأسف، لم تتجاوز الامتحان (راسب)"}
            </h2>
            <p style="color:#94A3B8; font-size:16px; margin-bottom:20px;">
              عدد الأخطاء: <strong style="color:${result.passed ? "#10B981" : "#EF4444"}; font-size:20px;">${result.errorsCount}</strong> من أصل 30 سؤالاً (الحد الأقصى المسموح 3 أخطاء)
            </p>

            <div style="display:flex; justify-content:center; gap:12px; margin-bottom:30px;">
              <a href="scheda-esame.html" class="choice-btn choice-btn-vero" style="text-decoration:none; padding:12px 24px; font-size:1rem;">
                <span>🔄 امتحان جديد</span>
              </a>
              <a href="dashboard.html#mistakes" class="choice-btn choice-btn-falso" style="text-decoration:none; padding:12px 24px; font-size:1rem;">
                <span>⚠️ مراجعة الأخطاء في بنك أخطائي</span>
              </a>
            </div>

            <h3 style="text-align:right; margin:30px 0 16px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; font-weight:800;">
              🔍 كشف الألغاز وتحليل الأسئلة:
            </h3>

            <div style="text-align:right;">
              ${result.details.map(d => {
                const rawImg = (d.img || d.immagine || "").trim();
                const imgPath = resolveImgPath(rawImg);
                return `
                <div style="background:rgba(255,255,255,0.03); border:1px solid ${d.isCorrect ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}; border-radius:16px; padding:18px; margin-bottom:14px;">
                  <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                    <span style="font-weight:800; font-size:15px;">سؤال #${d.index}</span>
                    <span style="color:${d.isCorrect ? '#10B981' : '#EF4444'}; font-weight:800; font-size:14px;">
                      ${d.isCorrect ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة"} (إجابتك: ${d.userAnswer === null ? 'متروك' : (d.userAnswer ? 'V' : 'F')} | الصحيح: ${d.correctAnswer ? 'V' : 'F'})
                    </span>
                  </div>
                  ${imgPath ? `<div class="exam-img-frame" style="max-height:120px; margin:8px 0;"><img src="${imgPath}" alt="Segnale" style="max-height:100px;"></div>` : ''}
                  <div style="font-weight:700; margin-bottom:8px; color:#FFFFFF; font-family:'JetBrains Mono',monospace;">${d.domanda}</div>
                  <div style="color:#38BDF8; font-size:14px; margin-bottom:6px;">📖 الترجمة: ${d.traduzione || 'غير متوفرة'}</div>
                  <div style="color:#94A3B8; font-size:13px; margin-bottom:6px;">💡 الشرح: ${d.spiegazione || 'راجع نصوص كود السير.'}</div>
                  ${d.trabocchetto ? `<div style="background:rgba(244,63,94,0.1); border:1px solid rgba(244,63,94,0.3); border-radius:10px; padding:8px 12px; font-size:13px; color:#FDA4AF; margin-top:8px;">⚠️ فخ الامتحان: ${d.trabocchetto}</div>` : ""}
                  ${window.questionDecoder ? window.questionDecoder.renderDecoderCard({ q: d.domanda, tr: d.traduzione, a: d.correctAnswer, sp: d.spiegazione, tb: d.trabocchetto }, { collapsed: false }) : ''}
                </div>
              `;}).join("")}
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
