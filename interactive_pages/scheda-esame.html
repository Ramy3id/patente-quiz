<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محاكي الامتحان الوزاري الرسمي | Patente B Pro</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="interactive_style.css">
  <link rel="stylesheet" href="../assets/css/theme-modes.css">
  <script src="../assets/js/theme-engine.js"></script>
  <style>
    .exam-portal-container {
      max-width: 960px;
      margin: 16px auto 40px;
      padding: 0 16px;
    }
    .exam-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 16px;
    }
    .exam-timer-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .exam-timer-box.timer-warning {
      color: #EF4444;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.75; transform: scale(1.05); }
    }
    .exam-nav-pills {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .exam-nav-pills {
        grid-template-columns: repeat(10, 1fr);
      }
    }
    .q-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .q-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
    }
    .q-pill.active {
      border-color: #38BDF8;
      background: rgba(56, 189, 248, 0.2);
      color: #38BDF8;
    }
    .q-pill.answered {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10B981;
    }
    .exam-question-card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }
    .exam-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .exam-q-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .exam-text-it {
      font-family: 'JetBrains Mono', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.6;
      margin: 16px 0;
      text-align: right;
    }
    .exam-choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    .choice-btn {
      padding: 16px 20px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      font-family: inherit;
    }
    .choice-btn-vero {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #10B981;
    }
    .choice-btn-vero:hover, .choice-btn-vero.selected {
      background: #10B981;
      color: #FFFFFF;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }
    .choice-btn-falso {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #EF4444;
    }
    .choice-btn-falso:hover, .choice-btn-falso.selected {
      background: #EF4444;
      color: #FFFFFF;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
    }
    .btn-submit-exam {
      background: linear-gradient(135deg, #38BDF8, #2563EB);
      color: #FFFFFF;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 17px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-submit-exam:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45);
    }
    .btn-nav-step {
      padding: 10px 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-nav-step:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
    }
    .btn-nav-step:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- شريط الملاحة الموحد والأدوات التفاعلية -->
  <nav class="unified-portal-nav" id="portal-nav">
    <a href="../index.html" class="nav-brand">
      <span style="font-size:1.25rem;">🚦</span>
      <span>Patente B Pro</span>
      <span class="badge-tag">A2</span>
    </a>
    <nav class="nav-desktop-tabs">
      <a href="scheda-esame.html" class="nav-tab-desktop active">📝 الامتحان</a>
      <a href="flashcards.html" class="nav-tab-desktop">💡 بطاقات الفلاش</a>
      <a href="dashboard.html" class="nav-tab-desktop">📊 لوحة البيانات</a>
      <a href="traps_and_games.html" class="nav-tab-desktop">🎮 الفخاخ والألعاب</a>
      <a href="index.html" class="nav-tab-desktop">🏛️ أدلة الشرح</a>
      <a href="../Capitoli_Divisi/index.html" class="nav-tab-desktop">📚 بنك الأسئلة</a>
    </nav>
    <div class="nav-desktop-actions">
      <button class="nav-theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الوضع (نهاري / ليلي) [Alt + T]">
        <span class="theme-icon-span">☀️</span>
        <span class="theme-label-span">الوضع النهاري</span>
      </button>
    </div>
  </nav>
  <a href="../index.html" class="action-btn home-btn">🏠 العودة للصفحة الرئيسة</a>

  <div class="exam-portal-container">
    <div class="exam-top-bar">
      <div class="exam-timer-box" id="examTimerDisplay">⏱️ 20:00</div>
      <div style="font-weight:800; color:#94A3B8;">
        تمت الإجابة: <span id="answeredCounter" style="color:#38BDF8;">0</span> / 30
      </div>
    </div>

    <!-- شبكة أرقام الأسئلة للتنقل السريع -->
    <div class="exam-nav-pills" id="examPillsGrid"></div>

    <!-- بطاقة السؤال النشط -->
    <div class="exam-question-card" id="questionCardStage">
      <div style="text-align:center; padding:40px; color:#94A3B8;">جاري إعداد بطاقة الامتحان الوزاري...</div>
    </div>

    <!-- زر تسليم الامتحان -->
    <button type="button" class="btn-submit-exam" id="btnSubmitFinalExam">
      📋 تسليم الامتحان النهائي وتصحيح النتيجة
    </button>
  </div>

  <script src="../assets/js/quiz-engine.js"></script>
  <script src="../assets/js/srs-engine.js"></script>
  <script src="../assets/js/audio-engine.js"></script>

  <script>
    function resolveImgPath(img) {
      if (!img) return null;
      const filename = img.split('/').pop().trim();
      return filename ? `../img_sign/${filename}` : null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const exam = new PatenteExamEngine({
        totalQuestions: 30,
        durationMinutes: 20,
        onTick: (formattedTime, remainingSec) => {
          const tEl = document.getElementById("examTimerDisplay");
          if (tEl) {
            tEl.textContent = `⏱️ ${formattedTime}`;
            if (remainingSec <= 300) tEl.classList.add("timer-warning");
          }
        },
        onFinish: (result) => renderExamResults(result)
      });

      const srs = new PatenteSRSEngine();
      const audio = new PatenteAudioEngine();

      try {
        const res = await fetch("../assets/all_questions.json");
        const data = await res.json();
        const pool = data.domande || data;

        exam.loadQuestions(pool);
        exam.startTimer();
        renderActiveQuestion();
        renderPills();
      } catch (e) {
        document.getElementById("questionCardStage").innerHTML = `
          <div style="text-align:center; padding:30px; color:#EF4444;">
            ⚠️ تعذر تحميل ملف الأسئلة تلقائياً.
          </div>
        `;
      }

      function renderPills() {
        const grid = document.getElementById("examPillsGrid");
        if (!grid) return;
        grid.innerHTML = exam.questions.map((q, idx) => `
          <div class="q-pill ${exam.currentIndex === idx ? 'active' : ''} ${exam.answers[q.id] !== undefined ? 'answered' : ''}" 
               data-idx="${idx}">
            ${idx + 1}
          </div>
        `).join("");

        grid.querySelectorAll(".q-pill").forEach(p => {
          p.addEventListener("click", () => {
            exam.goToQuestion(parseInt(p.dataset.idx));
            renderActiveQuestion();
            renderPills();
          });
        });
      }

      function renderActiveQuestion() {
        const q = exam.getCurrentQuestion();
        if (!q) return;

        const currentAnswer = exam.answers[q.id];
        const stage = document.getElementById("questionCardStage");
        const imgPath = resolveImgPath(q.immagine);

        stage.innerHTML = `
          <div class="exam-q-header">
            <span class="exam-q-badge">سؤال رقم ${exam.currentIndex + 1} من 30</span>
            <span style="font-size:13px; color:#94A3B8; font-family:'JetBrains Mono',monospace;">ID: ${q.id}</span>
          </div>

          ${imgPath ? `<div class="exam-img-frame"><img src="${imgPath}" alt="Segnale" onerror="this.parentElement.style.display='none'"></div>` : ""}

          <div class="exam-text-it">${q.domanda}</div>

          <div class="exam-choice-buttons">
            <button type="button" class="choice-btn choice-btn-vero ${currentAnswer === true ? 'selected' : ''}" id="btnVero">
              VERO (صح)
            </button>
            <button type="button" class="choice-btn choice-btn-falso ${currentAnswer === false ? 'selected' : ''}" id="btnFalso">
              FALSO (خطأ)
            </button>
          </div>

          <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button type="button" class="btn-nav-step" id="btnPrev" ${exam.currentIndex === 0 ? 'disabled' : ''}>السابق</button>
            <button type="button" class="btn-nav-step" id="btnNext" ${exam.currentIndex === exam.questions.length - 1 ? 'disabled' : ''}>التالي</button>
          </div>
        `;

        document.getElementById("answeredCounter").textContent = exam.getAnsweredCount();

        document.getElementById("btnVero").addEventListener("click", () => {
          exam.recordAnswer(q.id, true);
          audio.playFeedbackTone("click");
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnFalso").addEventListener("click", () => {
          exam.recordAnswer(q.id, false);
          audio.playFeedbackTone("click");
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnNext").addEventListener("click", () => {
          exam.nextQuestion();
          renderActiveQuestion();
          renderPills();
        });

        document.getElementById("btnPrev").addEventListener("click", () => {
          exam.prevQuestion();
          renderActiveQuestion();
          renderPills();
        });
      }

      document.getElementById("btnSubmitFinalExam").addEventListener("click", () => {
        const remaining = 30 - exam.getAnsweredCount();
        if (remaining > 0 && !confirm(`لديك ${remaining} سؤالاً لم تجب عليه بعد. هل تريد تسليم الامتحان الآن؟`)) {
          return;
        }
        exam.submitExam("USER_SUBMIT");
      });

      function renderExamResults(result) {
        // حفظ في سجل localStorage
        const history = JSON.parse(localStorage.getItem("patente_exam_history") || "[]");
        history.push({
          date: new Date().toLocaleDateString('ar-EG'),
          passed: result.passed,
          errors: result.errorsCount,
          duration: `${Math.floor((1200 - exam.remainingSeconds)/60)} دقيقة`
        });
        localStorage.setItem("patente_exam_history", JSON.stringify(history));

        // تسجيل الأخطاء في SRS
        result.details.forEach(item => {
          if (!item.isCorrect) {
            srs.logQuestionAttempt(item, false);
          }
        });

        const container = document.querySelector(".exam-portal-container");
        container.innerHTML = `
          <div class="exam-question-card" style="text-align:center;">
            <div style="font-size:54px; margin-bottom:12px;">${result.passed ? "🎉" : "❌"}</div>
            <h2 style="color:${result.passed ? "#10B981" : "#EF4444"}; font-size:28px; margin-bottom:8px; font-weight:800;">
              ${result.passed ? "مبروك! ناجح في الامتحان الوزاري" : "للأسف، لم تتجاوز الامتحان (راسب)"}
            </h2>
            <p style="color:#94A3B8; font-size:16px; margin-bottom:20px;">
              عدد الأخطاء: <strong style="color:${result.passed ? "#10B981" : "#EF4444"}; font-size:20px;">${result.errorsCount}</strong> من أصل 30 سؤالاً (الحد الأقصى المسموح 3 أخطاء)
            </p>

            <h3 style="text-align:right; margin:30px 0 16px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; font-weight:800;">
              🔍 كشف الألغاز وتحليل الأسئلة:
            </h3>

            <div style="text-align:right;">
              ${result.details.map(d => {
                const imgPath = resolveImgPath(d.immagine);
                return `
                <div style="background:rgba(255,255,255,0.03); border:1px solid ${d.isCorrect ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}; border-radius:16px; padding:18px; margin-bottom:14px;">
                  <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                    <span style="font-weight:800; font-size:15px;">سؤال #${d.index}</span>
                    <span style="color:${d.isCorrect ? '#10B981' : '#EF4444'}; font-weight:800; font-size:14px;">
                      ${d.isCorrect ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة"} (إجابتك: ${d.userAnswer === null ? 'متروك' : (d.userAnswer ? 'V' : 'F')} | الصحيح: ${d.correctAnswer ? 'V' : 'F'})
                    </span>
                  </div>
                  ${imgPath ? `<div class="exam-img-frame" style="max-height:120px; margin:8px 0;"><img src="${imgPath}" alt="Segnale" style="max-height:100px;"></div>` : ''}
                  <div style="font-weight:700; margin-bottom:8px; color:#FFFFFF; font-family:'JetBrains Mono',monospace;">${d.domanda}</div>
                  <div style="color:#38BDF8; font-size:14px; margin-bottom:6px;">📖 الترجمة: ${d.traduzione || 'غير متوفرة'}</div>
                  <div style="color:#94A3B8; font-size:13px; margin-bottom:6px;">💡 الشرح: ${d.spiegazione || 'راجع نصوص كود السير.'}</div>
                  ${d.trabocchetto ? `<div style="background:rgba(244,63,94,0.1); border:1px solid rgba(244,63,94,0.3); border-radius:10px; padding:8px 12px; font-size:13px; color:#FDA4AF; margin-top:8px;">⚠️ فخ الامتحان: ${d.trabocchetto}</div>` : ""}
                </div>
              `;}).join("")}
            </div>

            <a href="scheda-esame.html" class="btn-submit-exam" style="display:inline-block; margin-top:20px; text-decoration:none;">
              🔄 إجراء امتحان وزاري جديد
            </a>
          </div>
        `;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../service-worker.js').catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
