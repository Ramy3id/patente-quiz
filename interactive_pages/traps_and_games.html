<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بنك الفخاخ وتحدي المطابقة | Patente B Pro</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ch04_style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DIYhudeG.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CceglpVi.css">
  <style>
    .vault-container {
      max-width: 900px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }
    .vault-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .vault-tab-btn {
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .vault-tab-btn.active {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
    }
    .vault-tab-btn.game-tab.active {
      background: linear-gradient(135deg, #38BDF8, #2563EB);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }

    /* بنك الفخاخ */
    .trap-cards-grid {
      display: grid;
      gap: 16px;
    }
    .trap-card-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(244, 63, 94, 0.25);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    .trap-card-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .trap-badge {
      background: rgba(244, 63, 94, 0.15);
      color: #FDA4AF;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .trap-keyword-highlight {
      background: rgba(244, 63, 94, 0.35);
      color: #FFF;
      padding: 2px 6px;
      border-radius: 6px;
      border-bottom: 2px solid #F43F5E;
      font-weight: 800;
    }
    .trap-it-text {
      font-family: 'JetBrains Mono', sans-serif;
      font-size: 17px;
      color: #FFFFFF;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* لعبة المطابقة */
    .matching-game-wrap {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .matching-header {
      display: flex;
      justify-content: space-around;
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 16px;
    }
    .matching-timer { color: #38BDF8; font-family: 'JetBrains Mono', monospace; }
    .matching-score { color: #F59E0B; }
    .matching-streak { color: #10B981; }
    .matching-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 640px) {
      .matching-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .match-card {
      min-height: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .match-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .match-card.is-selected {
      border-color: #38BDF8;
      background: rgba(56, 189, 248, 0.15);
      transform: scale(1.02);
    }
    .match-card.is-matched {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.2);
      pointer-events: none;
      opacity: 0.6;
    }
    .match-card.is-wrong {
      border-color: #EF4444;
      background: rgba(239, 68, 68, 0.2);
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .match-img { max-height: 60px; object-fit: contain; }
    .match-it-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF; }
    .match-ar-text { font-size: 14px; font-weight: 700; color: #38BDF8; }
  </style>
</head>
<body>

  <!-- شريط الملاحة الموحد 54px -->
  <nav class="unified-portal-nav" id="portal-nav">
    <!-- Brand -->
    <a href="../المكتبة_الشاملة_المعتمدة/index.html" class="nav-brand">
      <span style="font-size:1.25rem;">🚦</span>
      <span>Patente B Pro</span>
      <span class="badge-tag">A2</span>
    </a>
    <!-- Desktop Tabs Menu -->
    <nav class="nav-desktop-tabs">
      <a href="scheda-esame.html" class="nav-tab-desktop">📝 الامتحان</a>
      <a href="flashcards.html" class="nav-tab-desktop">💡 بطاقات الفلاش</a>
      <a href="dashboard.html" class="nav-tab-desktop">📊 لوحة البيانات</a>
      <a href="traps_and_games.html" class="nav-tab-desktop">🎮 الفخاخ والألعاب</a>
    </nav>
  </nav>
  <a href="../المكتبة_الشاملة_المعتمدة/index.html" class="action-btn home-btn">🏠 العودة للصفحة الرئيسة</a>

  <div class="vault-container">
    <div class="vault-tabs">
      <button class="vault-tab-btn active" id="tabTraps">🚨 بنك الفخاخ القاتلة (300 سؤال)</button>
      <button class="vault-tab-btn game-tab" id="tabGame">⚡ لعبة تحدي السرعة والمطابقة</button>
    </div>

    <!-- قسم بنك الفخاخ -->
    <div id="sectionTraps">
      <div class="trap-cards-grid" id="trapsGrid">
        <div style="text-align:center; padding:40px; color:#94A3B8;">جاري استخراج وفلترة أصعب فخاخ الامتحان...</div>
      </div>
    </div>

    <!-- قسم لعبة المطابقة -->
    <div id="sectionGame" style="display:none;">
      <div id="gameContainer"></div>
    </div>
  </div>

  <!-- المحركات المركزية -->
  <script src="../assets/js/trap-vault.js"></script>
  <script src="../assets/js/matching-engine.js"></script>
  <script src="../assets/js/audio-engine.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const trapsEngine = new PatenteTrapEngine();
      const audio = new PatenteAudioEngine();

      let allQuestions = [];
      const trapsGrid = document.getElementById("trapsGrid");
      const gameContainer = document.getElementById("gameContainer");

      try {
        const res = await fetch("../assets/all_questions.json");
        allQuestions = await res.json();
        renderTraps();
        setupGame();
      } catch (e) {
        trapsGrid.innerHTML = `<div style="text-align:center; color:#EF4444; padding:30px;">⚠️ تعذر تحميل البيانات.</div>`;
      }

      function renderTraps() {
        const tricky = trapsEngine.filterTraps(allQuestions).slice(0, 100);
        trapsGrid.innerHTML = tricky.map((q, idx) => {
          const highlightedText = trapsEngine.highlightTrapWords(q.domanda);
          return `
            <div class="trap-card-item">
              <div class="trap-card-header">
                <span class="trap-badge">فخ #${idx + 1} | باب ${q.capitolo_num || 1}</span>
                <span style="font-weight:700; color:${q.risposta ? '#10B981' : '#EF4444'};">
                  الحكم: ${q.risposta ? 'VERO' : 'FALSO'}
                </span>
              </div>
              <div class="trap-it-text">${highlightedText}</div>
              <div style="color:#38BDF8; font-size:14px; margin-bottom:6px;"><strong>📖 الترجمة:</strong> ${q.traduzione}</div>
              <div style="color:#CBD5E1; font-size:13px; margin-bottom:8px;"><strong>💡 الشرح:</strong> ${q.spiegazione}</div>
              <div style="background:rgba(244,63,94,0.1); border:1px solid rgba(244,63,94,0.3); border-radius:10px; padding:8px; font-size:13px; color:#FDA4AF;">
                <strong>🚨 فخ الامتحان:</strong> ${q.trabocchetto || 'انتبه لصيغة النفي أو الحصر الواردة بالنص.'}
              </div>
            </div>
          `;
        }).join("");
      }

      function setupGame() {
        const matchingEngine = new PatenteMatchingGameEngine(gameContainer, {
          durationSeconds: 45,
          onScoreUpdate: () => audio.playFeedbackTone("click"),
          onGameOver: (res) => audio.playFeedbackTone(res.isWin ? "correct" : "error")
        });

        // اختيار 6 عناصر مناسبة للمطابقة
        const sampleItems = [
          { itText: "Carreggiata", arText: "نهر الطريق", image: null },
          { itText: "Corsia di emergenza", arText: "مسار الطوارئ", image: null },
          { itText: "Isola di traffico", arText: "جزيرة المرور", image: null },
          { itText: "Distanza di sicurezza", arText: "مسافة الأمان", image: null },
          { itText: "Freno a mano", arText: "فرامل اليد", image: null },
          { itText: "Sorpasso in curva", arText: "التجاوز في المنعطف", image: null }
        ];

        matchingEngine.startNewRound(sampleItems);
      }

      // التبديل بين التبويبات
      const tabTraps = document.getElementById("tabTraps");
      const tabGame = document.getElementById("tabGame");
      const secTraps = document.getElementById("sectionTraps");
      const secGame = document.getElementById("sectionGame");

      tabTraps.addEventListener("click", () => {
        tabTraps.classList.add("active");
        tabGame.classList.remove("active");
        secTraps.style.display = "block";
        secGame.style.display = "none";
      });

      tabGame.addEventListener("click", () => {
        tabGame.classList.add("active");
        tabTraps.classList.remove("active");
        secTraps.style.display = "none";
        secGame.style.display = "block";
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../service-worker.js').catch(err => console.log('SW err', err));
      });
    }
  </script>
</body>
</html>
