<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بنك الفخاخ وتحدي المطابقة | Patente B Pro</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="interactive_style.css">
  <link rel="stylesheet" href="../assets/css/theme-modes.css">
  <script src="../assets/js/theme-engine.js"></script>
  <style>
    .vault-container {
      max-width: 920px;
      margin: 16px auto 40px;
      padding: 0 16px;
    }
    .vault-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .vault-tab-btn {
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.7);
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .vault-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }
    .vault-tab-btn.active {
      background: #F43F5E;
      color: #FFFFFF;
      border-color: #F43F5E;
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.35);
    }
    .vault-tab-btn.game-tab.active {
      background: #38BDF8;
      border-color: #38BDF8;
      color: #0B0F19;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
    }

    /* لعبة المطابقة */
    .matching-game-wrap {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .matching-header {
      display: flex;
      justify-content: space-around;
      margin-bottom: 24px;
      font-size: 18px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 14px;
    }
    .matching-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .match-card {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 8px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .match-card:hover {
      border-color: #38BDF8;
      transform: translateY(-2px);
    }
    .match-card.is-selected {
      border-color: #F59E0B;
      background: rgba(245, 158, 11, 0.15);
    }
    .match-card.is-matched {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.2);
      opacity: 0.5;
      pointer-events: none;
    }
    .match-img { max-height: 60px; object-fit: contain; }
    .match-it-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #FFFFFF; }
    .match-ar-text { font-size: 14px; font-weight: 700; color: #38BDF8; }
  </style>
</head>
<body>

  <!-- شريط الملاحة الموحد والأدوات التفاعلية -->
  <nav class="unified-portal-nav" id="portal-nav">
    <a href="../index.html" class="nav-brand">
      <span style="font-size:1.25rem;">🚦</span>
      <span>Patente B Pro</span>
      <span class="badge-tag">A2</span>
    </a>
    <nav class="nav-desktop-tabs">
      <a href="scheda-esame.html" class="nav-tab-desktop">📝 الامتحان</a>
      <a href="flashcards.html" class="nav-tab-desktop">💡 بطاقات الفلاش</a>
      <a href="dashboard.html" class="nav-tab-desktop">📊 لوحة البيانات</a>
      <a href="traps_and_games.html" class="nav-tab-desktop active">🎮 الفخاخ والألعاب</a>
      <a href="index.html" class="nav-tab-desktop">🏛️ أدلة الشرح</a>
      <a href="../Capitoli_Divisi/index.html" class="nav-tab-desktop">📚 بنك الأسئلة</a>
    </nav>
    <div class="nav-desktop-actions">
      <button class="nav-theme-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الوضع (نهاري / ليلي) [Alt + T]">
        <span class="theme-icon-span">☀️</span>
        <span class="theme-label-span">الوضع النهاري</span>
      </button>
    </div>
  </nav>
  <a href="../index.html" class="action-btn home-btn">🏠 العودة للصفحة الرئيسة</a>

  <div class="vault-container">
    <div class="vault-tabs">
      <button class="vault-tab-btn active" id="tabTraps">🚨 بنك الفخاخ القاتلة (300 سؤال)</button>
      <button class="vault-tab-btn game-tab" id="tabGame">⚡ لعبة تحدي السرعة والمطابقة</button>
    </div>

    <!-- قسم بنك الفخاخ -->
    <div id="sectionTraps">
      <div class="trap-cards-grid" id="trapsGrid">
        <div style="text-align:center; padding:40px; color:#94A3B8;">جاري استخراج وفلترة أصعب فخاخ الامتحان مع الصور التوضيحية...</div>
      </div>
    </div>

    <!-- قسم لعبة المطابقة -->
    <div id="sectionGame" style="display:none;">
      <div id="gameContainer"></div>
    </div>
  </div>

  <!-- المحركات المركزية -->
  <script src="../assets/js/trap-vault.js"></script>
  <script src="../assets/js/matching-engine.js"></script>
  <script src="../assets/js/audio-engine.js"></script>

  <script>
    function resolveImgPath(img) {
      if (!img) return null;
      const filename = img.split('/').pop().trim();
      return filename ? `../img_sign/${filename}` : null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const trapsEngine = new PatenteTrapEngine();
      const audio = new PatenteAudioEngine();

      let allQuestions = [];
      const trapsGrid = document.getElementById("trapsGrid");
      const gameContainer = document.getElementById("gameContainer");

      try {
        const res = await fetch("../assets/all_questions.json");
        allQuestions = await res.json();
        renderTraps();
        setupGame();
      } catch (e) {
        trapsGrid.innerHTML = `<div style="text-align:center; color:#EF4444; padding:30px;">⚠️ تعذر تحميل البيانات.</div>`;
      }

      function renderTraps() {
        const tricky = trapsEngine.filterTraps(allQuestions).slice(0, 100);
        trapsGrid.innerHTML = tricky.map((q, idx) => {
          const highlightedText = trapsEngine.highlightTrapWords(q.domanda);
          const imgPath = resolveImgPath(q.immagine);
          return `
            <div class="trap-card-item">
              <div class="trap-card-header">
                <span class="trap-badge">🚨 فخ #${idx + 1} | باب ${q.capitolo_num || 1}</span>
                <span class="trap-verdict ${q.risposta ? 'verdict-vero' : 'verdict-falso'}">
                  الحكم: ${q.risposta ? 'VERO (صح)' : 'FALSO (خطأ)'}
                </span>
              </div>
              ${imgPath ? `<div class="trap-img-box"><img src="${imgPath}" alt="Segnale" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
              <div class="trap-it-text">${highlightedText}</div>
              <div class="trap-ar-text"><strong>📖 الترجمة:</strong> ${q.traduzione || 'غير متوفرة'}</div>
              <div class="trap-explanation"><strong>💡 الشرح القانوني:</strong> ${q.spiegazione || 'راجع نصوص كود السير.'}</div>
              <div class="trap-box">
                <strong>⚠️ فخ السؤال:</strong> ${q.trabocchetto || 'انتبه لصيغة النفي أو الحصر أو الشروط الواردة بالنص.'}
              </div>
            </div>
          `;
        }).join("");
      }

      function setupGame() {
        const matchingEngine = new PatenteMatchingGameEngine(gameContainer, {
          durationSeconds: 45,
          onScoreUpdate: () => audio.playFeedbackTone("click"),
          onGameOver: (res) => audio.playFeedbackTone(res.isWin ? "correct" : "error")
        });

        // اختيار 6 عناصر مناسبة للمطابقة مع صور رسمية
        const sampleItems = [
          { itText: "Carreggiata", arText: "نهر الطريق", image: "../img_sign/550.png" },
          { itText: "Divieto di transito", arText: "ممنوع المرور بالاتجاهين", image: "../img_sign/101.png" },
          { itText: "Divieto di sosta", arText: "ممنوع الوقوف", image: "../img_sign/102.png" },
          { itText: "Dare precedenza", arText: "إعطاء الأسبقية", image: "../img_sign/36.png" },
          { itText: "Passaggio a livello", arText: "معبر سكة حديد", image: "../img_sign/10.png" },
          { itText: "Senso unico alternato", arText: "مرور باتجاه واحد متناوب", image: "../img_sign/44.png" }
        ];

        matchingEngine.startNewRound(sampleItems);
      }

      const tabTraps = document.getElementById("tabTraps");
      const tabGame = document.getElementById("tabGame");
      const secTraps = document.getElementById("sectionTraps");
      const secGame = document.getElementById("sectionGame");

      tabTraps.addEventListener("click", () => {
        tabTraps.classList.add("active");
        tabGame.classList.remove("active");
        secTraps.style.display = "block";
        secGame.style.display = "none";
      });

      tabGame.addEventListener("click", () => {
        tabGame.classList.add("active");
        tabTraps.classList.remove("active");
        secTraps.style.display = "none";
        secGame.style.display = "block";
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../service-worker.js').catch(err => console.log('SW err', err));
      });
    }
  </script>
</body>
</html>
