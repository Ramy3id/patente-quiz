<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="8"/>
  <rect x="176" y="96" width="160" height="320" rx="45" fill="#181E2C" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- Red light -->
  <circle cx="256" cy="156" r="38" fill="#F43F5E" filter="url(#glow)"/>
  <!-- Amber light -->
  <circle cx="256" cy="256" r="38" fill="#F59E0B" filter="url(#glow)"/>
  <!-- Green light -->
  <circle cx="256" cy="356" r="38" fill="#10B981" filter="url(#glow)"/>
  <!-- Badge text -->
  <text x="256" y="470" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#38BDF8" text-anchor="middle" letter-spacing="2">PATENTE B</text>
</svg>